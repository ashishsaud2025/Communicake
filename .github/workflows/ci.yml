name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  linux:
    name: Linux / GCC
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopencv-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel
